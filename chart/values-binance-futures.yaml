---
config:
  dry_run: true
  dry_run_wallet: 500000
  stake_amount: unlimited
  max_open_trades: 100
  minimal_roi:
    "0": 0.09
  stoploss: -0.12
  timeframe: 5m
  trailing_stop: false
  trailing_only_offset_is_reached: false
  trailing_stop_positive: 0.09
  trailing_stop_positive_offset: 0.1
  use_custom_stoploss: true
  has_downtime_protection: false
  # Run "populate_indicators()" only for new candle.
  process_only_new_candles: true
  # These values can be overridden in the "ask_strategy" section in the config.
  use_exit_signal: true
  exit_profit_only: false
  ignore_roi_if_entry_signal: true
  trading_mode: futures
  margin_mode: isolated  
  # Number of candles the strategy requires before producing valid signals
  startup_candle_count: 800
  stake_amount_type: quote_currency
  entry_pricing:
    price_side: other
    use_order_book: true
    order_book_top: 1
    price_last_balance: 0
    check_depth_of_market:
      enabled: false
      bids_to_ask_delta: 1
  exit_pricing:
    price_side: other
    use_order_book: true
    order_book_top: 1
  dataformat_ohlcv: feather
  dataformat_trades: feather
  download_trades: false
  amend_last_stake_amount: true
  stake_currency: USDT
  tradable_balance_ratio: 0.99
  # fiat_display_currency: USD
  db_url: "sqlite:///sqlite/tradesv3.sqlite"
  cancel_open_orders_on_exit: false
  position_adjustment_enable: false
  order_types:
    emergency_exit: "market"
    entry: "market"
    force_entry: "market"
    force_exit: "market"
    exit: limit
    stoploss: "market"
    stoploss_on_exchange: false
    stoploss_on_exchange_interval: 60
    stoploss_on_exchange_limit_ratio: 0.99
  # margin_mode: ""
  unfilledtimeout:
    entry: 10
    exit: 30
    exit_timeout_count: 2
    unit: minutes
  order_time_in_force:
    entry: "FOK" # Fill or Kill ( all or nothinh )
    exit: "GTC" # Good till canceled (partially filling)
