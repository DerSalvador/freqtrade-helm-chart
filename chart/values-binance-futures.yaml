---
config:
  stoploss: -0.99
  dry_run: true
  dry_run_wallet: 500000
  stake_amount: unlimited
  max_open_trades: 1
  minimal_roi:
    "0": 0.2
  timeframe: 1m
  # trailing_stop: false
  # trailing_only_offset_is_reached: false
  # trailing_stop_positive: 0.09
  # trailing_stop_positive_offset: 0.1
  use_custom_stoploss: true
  has_downtime_protection: false
  # Run "populate_indicators()" only for new candle.
  process_only_new_candles: true
  # These values can be overridden in the "ask_strategy" section in the config.
  use_exit_signal: true
  exit_profit_only: false
  ignore_roi_if_entry_signal: false
  trading_mode: futures
  margin_mode: isolated  
  # Number of candles the strategy requires before producing valid signals
  startup_candle_count: 50
  stake_amount_type: quote_currency
  entry_pricing:
    price_side: other
    use_order_book: true
    order_book_top: 1
    price_last_balance: 0
    check_depth_of_market:
      enabled: false
      bids_to_ask_delta: 1
  exit_pricing:
    price_side: other
    use_order_book: true
    order_book_top: 1
  dataformat_ohlcv: feather
  dataformat_trades: feather
  download_trades: false
  amend_last_stake_amount: true
  stake_currency: USDT
  tradable_balance_ratio: 0.99
  disable_dataframe_checks: true  
  # fiat_display_currency: USD
  db_url: "sqlite:///sqlite/tradesv3.sqlite"
  cancel_open_orders_on_exit: false
  max_entry_position_adjustment: 0
  order_types:
    emergency_exit: "market"
    entry: "market"
    force_entry: "market"
    force_exit: "market"
    exit: limit
    stoploss: "limit"
    stoploss_on_exchange: true
    stoploss_on_exchange_interval: 5
    stoploss_price_type: last
    stoploss_on_exchange_limit_ratio: 0.995
  # margin_mode: ""
  unfilledtimeout:
    entry: 10
    exit: 30
    exit_timeout_count: 2
    unit: minutes
  order_time_in_force:
    entry: "FOK" # Fill or Kill ( all or nothinh )
    exit: "GTC" # Good till canceled (partially filling)
  exchange:
    pair_whitelist:
      - BTC/USDT:USDT
      - ETH/USDT:USDT
      - XRP/USDT:USDT
      - DOGE/USDT:USDT
      - ADA/USDT:USDT
      - DOT/USDT:USDT
      - JTO/USDT:USDT
      - XLM/USDT:USDT
      - IOTA/USDT:USDT
      - ALGO/USDT:USDT
      - GMX/USDT:USDT

    pair_blacklist: [
      # Emergency
      # "1000FLOKI/USDT:USDT","AR/USDT:USDT","ATOM/USDT:USDT","AXL/USDT:USDT","BEAMX/USDT:USDT","BTC/USDT:USDT","ETH/USDT:USDT","IOTA/USDT:USDT","LTC/USDT:USDT","MKR/USDT:USDT","PENDLE/USDT:USDT","RNDR/USDT:USDT","SAGA/USDT:USDT","TON/USDT:USDT","WLD/USDT:USDT",
      # Exchange
      "(BNB)/.*:.*",
      # Leverage
      ".*(_PREMIUM|BEAR|BULL|HALF|HEDGE|UP|DOWN|[1235][SL])/.*:.*",
      # Fiat
      "(AUD|BRZ|CAD|CHF|EUR|GBP|HKD|IDRT|JPY|NGN|RUB|SGD|TRY|UAH|USD|ZAR)/.*:.*",
      # Stable
      "(FDUSD|BUSD|CUSD|CUSDT|DAI|PAXG|SUSD|TUSD|USDC|USDN|USDP|USDT|VAI|UST|USTC|AUSD)/.*:.*",
      # FAN
      "(ACM|AFA|ALA|ALL|ALPINE|APL|ASR|ATM|BAR|CAI|CHZ|CITY|FOR|GAL|GOZ|IBFK|JUV|LEG|LOCK-1|NAVI|NMR|NOV|PFL|PSG|ROUSH|STV|TH|TRA|UCH|UFC|YBO)/.*:.*",
      # Others
      "(LINK|1EARTH|ILA|BOBA|CTXC|CWAR|HBAR|NMR|OMG|ONG|ARDR|DMTR|MLS|TORN|LUNA|BTS|QKC|COS|ACA|FTT|SRM|YFII|SNM|BNX|ANC|AION|MIR|BNX|STG|HNT|WABI|QLC|NEBL|AUTO|VGX|PEPE|VITE|DREP|JASMY|PNT|PERL|AMB|OAX|LOOM|BTS|RAD|ID|PNT|NULS|MLN|MEME|TOKEN|TOMO|BTS|PERL|WTC)/.*:.*"
    ]
    ccxt_config:
      enableRateLimit: true
      rateLimit: 500
      options:
        defaultType: future
        leverage: 5
    ccxt_async_config:
      enableRateLimit: true
      rateLimit: 500
      options:
        defaultType: future
        leverage: 5 
    name: binance  
    key: Ie1qiv3hF3gfMGIsyZxdxNDSVSfz8INIWGRKkUwPEejNGRikh2toUVZb1WlH2X2P
    secret: 3z4uF8JTXEJLN23IZmQJ9uQuOBc8AdD7ZEwkO5kg5FWm1SsbFMTIIp48usFzhk9r
  pairlists:
    - method: StaticPairList
      mode: whitelist
      processing_mode: append
    # - method: RemotePairList
    #   number_assets: 19
    #   pairlist_url: http://filekeys.com/remotepairlist-white-futures-static.json # http://filekeys.com/remotepairlist-white-futures.json   # https://remotepairlist.com?q=6ed672791d1040c0
    #   mode: whitelist
    #   processing_mode: append
    #   refresh_period: 900
    #   keep_pairlist_on_failure: true
    #   read_timeout: 120
    - method: VolumePairList
      processing_mode: append
      number_assets: 50
      sort_key: quoteVolume
      sort_ascending: false
      refresh_period: 86400
      lookback_timeframe: 1m
      lookback_period: 144

    - method: MarketCapPairList
      number_assets: 10
      max_rank: 100
      refresh_period: 86400
      categories:
        - proof-of-work-pow
        - layer-1
        - layer-2
        - decentralized-exchange
        - tokenized-btc
        - proof-of-stake-pos

    - method: VolatilityFilter
      processing_mode: append
      lookback_period: 7
      min_volatility: 0.005
      max_volatility: 0.8
      allowed_assets: 10
      refresh_period: 86400

    - method: PerformanceFilter
      processing_mode: append
      lookback_period: 7
      min_performance: 0.01
      max_performance: 1.0
      allowed_assets: 10
      min_profit: 0.005
      refresh_period: 86400

    - method: ShuffleFilter
      seed: 44

  freqai:
    enabled: false
    rl_config:
      train_cycles: 25
      add_state_info: true
      max_trade_duration_candles: 300
      max_training_drawdown_pct: 0.02
      cpu_count: 8
      model_type: PPO
      policy_type: MlpPolicy
      model_reward_parameters:
        rr: 1
        profit_aim: 0.5
    fit_live_predictions_candles: 300
    purge_old_models: true # 2
    train_period_days: 30
    identifier: unique-id
    backtest_period_days: 7
    live_retrain_hours: 0
    feature_parameters:
      include_timeframes:
        - 15m
        - 1h
      include_corr_pairlist:
        - ATOM/USDT:USDT
        - MATIC/USDT:USDT
        - ADA/USDT:USDT
        - ALGO/USDT:USDT
        - APE/USDT:USDT
        - ATOM/USDT:USDT
        - AVAX/USDT:USDT
        - BCH/USDT:USDT
        - BTC/USDT:USDT
        - DAI/USDT:USDT
        - DOGE/USDT:USDT
        - DOT/USDT:USDT
        - EOS/USDT:USDT
        - ETH/USDT:USDT
        - LINK/USDT:USDT
        - LTC/USDT:USDT
        - MANA/USDT:USDT
        - MATIC/USDT:USDT
        - SHIB/USDT:USDT
        - SOL/USDT:USDT
        - XMR/USDT:USDT
        - XRP/USDT:USDT
        - XTZ/USDT:USDT
        - BTC/USDT:USDT
        - ETH/USDT:USDT
      label_period_candles: 20
      include_shifted_candles: 2
      DI_threshold: 0.9
      weight_factor: 0.9
      principal_component_analysis: false
      use_SVM_to_remove_outliers: true
      indicator_periods_candles:
        - 3
        - 10
        - 20
      plot_feature_importances: 0
    data_split_parameters:
      test_size: 0
      random_state: 1
    model_training_parameters:
      n_estimators: 800
  telegram:
