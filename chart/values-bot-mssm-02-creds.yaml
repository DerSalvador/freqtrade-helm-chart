kubernetes:
  nodePort: 32372  # generated by template dsTradingDeployNewStrategyFromTemplate.sh

ingress:
  enabled: true  # Set to true to enable LoadBalancer service
  type: LoadBalancer  # Options: LoadBalancer, NodePort, ClusterIP
  annotations: {}
    # Example annotations for cloud providers:
    # GCP:
    #  cloud.google.com/load-balancer-type: "Internal"
    #  networking.gke.io/load-balancer-type: "Internal"
