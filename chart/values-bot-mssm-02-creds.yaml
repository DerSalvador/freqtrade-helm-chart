      mode: whitelist
      processing_mode: append
      number_assets: 10
      max_rank: 50
      categories:
        - proof-of-work-pow
        - layer-1
        - layer-2
        - decentralized-exchange
        - tokenized-btc
        - proof-of-stake-pos
      refresh_period: 86400
    - method: AgeFilter
      min_days_listed: 10
    - method: PrecisionFilter
    - method: PriceFilter
      low_price_ratio: 0.01
    - method: SpreadFilter
      max_spread_ratio: 0.005
    - method: RangeStabilityFilter
      lookback_days: 3
      min_rate_of_change: 0.01
