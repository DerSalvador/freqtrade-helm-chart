kubernetes:
  nodePort: 32392 # generated by template dsTradingDeployNewStrategyFromTemplate.sh
configcreds:
  bot_name: multimetricstrategy
  can_short: true
  dry_run: false
  dry_run_wallet: 100000
  exchange:
    name: binance
  margin_mode: isolated
  pairlists:
    - method: MarketCapPairList
      mode: whitelist
      processing_mode: append
      number_assets: 10
      max_rank: 50
      categories:
        - proof-of-work-pow
        - layer-1
        - layer-2
        - decentralized-exchange
        - tokenized-btc
        - proof-of-stake-pos
      refresh_period: 86400
    - method: AgeFilter
      min_days_listed: 10
    - method: PrecisionFilter
    - method: PriceFilter
      low_price_ratio: 0.01
    - method: SpreadFilter
      max_spread_ratio: 0.005
    - method: RangeStabilityFilter
      lookback_days: 3
      min_rate_of_change: 0.01
      refresh_period: 1800
  position_adjustment_enable: false
  stake_amount: 100
  stoploss: -0.99
  telegram:
    enabled: true
    token: 7020581178:AAGN2KOhJ3jCCXL_0p8s77uKo_5YPgICB1Y
    chat_id: "1759706931"
  timeframe: 1m
  trading_mode: futures
  strategy: MultiMetricStrategy
  strategy_config:
    GLASSNODE_API_KEY: your_glassnode_key
    CRYPTOQUANT_API_KEY: kNbgGQcoevj9IloKKXJOm6iaKrFibWFpy2Sm37XNHOcNF3lTYRybCnisuNDL9DPGbKYALXYAthm4MLZX
    INTOTHEBLOCK_API_KEY: your_intotheblock_key
    SANTIMENT_API_KEY: 4sh7p5gbwf7adojj_amy347xb3wdezyvd # your_santiment_key
    LUNARCRUSH_API_KEY: your_lunarcrush_key
    THETIE_API_KEY: your_thetie_key
    # Entry and Exit Thresholds (0-100 score scale)
    min_long_score: 70  # Minimum score to enter long position
    min_short_score: 70  # Minimum score to enter short position
    long_exit_threshold: 40  # Exit long if score drops below this
    short_exit_threshold: 60  # Exit short if score rises above this
    # Technical Indicator Thresholds
    rsi_overbought_threshold: 70  # RSI overbought for long exit
    rsi_oversold_threshold: 30  # RSI oversold for short exit
    roc_negative_threshold: -2  # ROC threshold for long exit (momentum loss)
    roc_positive_threshold: 2  # ROC threshold for short exit (momentum gain)
  available_capital: 500
  bias:
