config:
  timeframe: 5m
  stoploss: -0.99
  trailing_stop: false
  trailing_only_offset_is_reached: false
  trailing_stop_positive: 0.01
  trailing_stop_positive_offset: 0.03
  use_custom_stoploss: false
  has_downtime_protection: false
  # Do you want to use the hold feature? (with hold-trades.json)
  hold_support_enabled: true
  # Run "populate_indicators()" only for new candle.
  process_only_new_candles: true
  # These values can be overridden in the "ask_strategy" section in the config.
  use_exit_signal: true
  ignore_roi_if_entry_signal: true
  # Number of candles the strategy requires before producing valid signals
  # startup_candle_count: 720 # kraken doesnt provide 720 candles for 5m timeframe
  stake_amount_type: quote_currency
  entry_pricing:
    price_side: other
    use_order_book: true
    order_book_top: 1
    price_last_balance: 0
    check_depth_of_market:
      enabled: false
      bids_to_ask_delta: 1
  exit_pricing:
    price_side: other
    use_order_book: true
    order_book_top: 1
  minimal_roi:
    "0": 0.4
    "40160": 0.09
    "80160": 0  
  dataformat_ohlcv: feather
  dataformat_trades: feather
  download_trades: true
  dry_run: false
  dry_run_wallet: 4000
  stake_amount: unlimited
  position_adjustment_enable: true
  trading_mode: spot
  include_timeframes: [1m, 5m, 15m, 30m, 1h, 4h, 1d]
  max_open_trades: 3
  amend_last_stake_amount: true
  stake_currency: USDT
  tradable_balance_ratio: 0.99
  fiat_display_currency: EUR
  db_url: "sqlite:///user_data/tradesv3.sqlite"
  cancel_open_orders_on_exit: false
  exit_profit_only: true
  margin_mode: ""
  unfilledtimeout:
    entry: 10
    exit: 30
    exit_timeout_count: 0
    unit: minutes
  order_types:
    entry: "market"
    force_entry: "market"
    force_exit: "market"
    exit: limit
    stoploss: "market"
    stoploss_on_exchange: false
  exchange:
    ccxt_config:
      enableRateLimit: true
      rateLimit: 1200
      options:
        defaultType: spot
        leverage: 10
    ccxt_async_config:
      enableRateLimit: true
      rateLimit: 1200
      options:
        defaultType: spot
        leverage: 10
    pair_whitelist_disabled: []
    pair_blacklist_disabled: []
  pairlists:
    - method: RemotePairList
      number_assets: 50
      pairlist_url: http://filekeys.com/remotepairlist-white-spot.json # https://remotepairlist.com?q=175979476d5fc223
      processing_mode: filter
      mode: whitelist
      sort_key: quoteVolume
      refresh_period: 900
      keep_pairlist_on_failure: true
      read_timeout: 60
    # - method: RemotePairList
    #   number_assets: 50
    #   pairlist_url: https://remotepairlist.com?q=ac822c0252729ed2
    #   processing_mode: filter
    #   mode: blacklist
    #   sort_key: quoteVolume
    #   refresh_period: 900
    #   keep_pairlist_on_failure: true
    #   read_timeout: 60
    # - method: AgeFilter
    #   min_days_listed: 15
    # - method: PriceFilter
    #   low_price_ratio: 0.003
    # - method: SpreadFilter
    #   max_spread_ratio: 0.008
    # - method: RangeStabilityFilter
    #   lookback_days: 30
    #   min_rate_of_change: 0.01
    #   refresh_period: 900
    # - method: ShuffleFilter
  freqai:
    enabled: false
    fit_live_predictions_candles: 300
    purge_old_models: true
    train_period_days: 30
    identifier: unique-id
    live_retrain_hours: 1
    feature_parameters:
      include_timeframes:
        - 5m
      include_corr_pairlist:
        - ATOM/USDT
        - MATIC/USDT
        - ADA/USDT
        - ALGO/USDT
        - APE/USDT
        - ATOM/USDT
        - AVAX/USDT
        - BCH/USDT
        - BTC/USDT
        - DAI/USDT
        - DOGE/USDT
        - DOT/USDT
        - EOS/USDT
        - ETH/USDT
        - EURT/USDT
        - LINK/USDT
        - LTC/USDT
        - MANA/USDT
        - MATIC/USDT
        - SHIB/USDT
        - SOL/USDT
        - XMR/USDT
        - XRP/USDT
        - XTZ/USDT
      label_period_candles: 20
      include_shifted_candles: 2
      DI_threshold: 0.9
      weight_factor: 0.9
      principal_component_analysis: false
      use_SVM_to_remove_outliers: true
      indicator_periods_candles:
        - 3
        - 10
        - 20
    data_split_parameters:
      test_size: 0
      random_state: 1
    model_training_parameters:
      n_estimators: 800      
