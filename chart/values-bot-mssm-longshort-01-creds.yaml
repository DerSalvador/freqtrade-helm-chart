---
kubernetes:
  nodePort: 32380 # generated by template dsTradingDeployNewStrategyFromTemplate.sh
configcreds:
  available_capital: 1000 # generated by template dsTradingDeployNewStrategyFromTemplate.sh
  stake_amount: 50
  minimal_roi:
    "0": 0.08
    "40160": 0.01
    "80160": 0
  max_open_trades: 50
  stake_currency: USDT
  # fiat_display_currency: ""
  dry_run: false
  dry_run_wallet: 5000
  tradable_balance_ratio: 0.99
  cancel_open_orders_on_exit: false
  trading_mode: futures
  margin_mode: isolated
  stoploss: -0.05
  trailing_stop: true
  trailing_stop_positive: 0.05
  trailing_stop_positive_offset: 0.1
  trailing_only_offset_is_reached: true
  timeframe: 5m
  unfilledtimeout:
    entry: 5
    exit: 10
    exit_timeout_count: 0
    unit: minutes
  entry_pricing:
    price_side: same
    use_order_book: true
    order_book_top: 1
    price_last_balance: 0
    check_depth_of_market:
      enabled: false
      bids_to_ask_delta: 1
  exit_pricing:
    price_side: same
    use_order_book: true
    order_book_top: 1
  use_exit_signal: true  
  bot_name: bot-mssm-longshort-01 # generated by template dsTradingDeployNewStrategyFromTemplate.sh
  initial_state: running
  order_types:
    entry: "limit"
    exit": "market"
    emergency_exit: "market"
    stoploss: "market"
    stoploss_on_exchange: False
    stoploss_on_exchange_interval: 60
    stoploss_on_exchange_limit_ratio: 0.99
  use_custom_stoploss: false
  has_downtime_protection: false
  position_adjustment_enable: false
  exchange:
    pair_blacklist: [
      # Emergency
      "1000FLOKI/USDT:USDT","AR/USDT:USDT","ATOM/USDT:USDT","AXL/USDT:USDT","BEAMX/USDT:USDT","BTC/USDT:USDT","ETH/USDT:USDT","IOTA/USDT:USDT","LTC/USDT:USDT","MKR/USDT:USDT","PENDLE/USDT:USDT","RNDR/USDT:USDT","SAGA/USDT:USDT","TON/USDT:USDT","WLD/USDT:USDT",
      # Exchange
      "(BNB)/.*",
      # Leverage
      ".*(_PREMIUM|BEAR|BULL|HALF|HEDGE|UP|DOWN|[1235][SL])/.*",
      # Fiat
      "(AUD|BRZ|CAD|CHF|EUR|GBP|HKD|IDRT|JPY|NGN|RUB|SGD|TRY|UAH|USD|ZAR)/.*",
      # Stable
      "(FDUSD|BUSD|CUSD|CUSDT|DAI|PAXG|SUSD|TUSD|USDC|USDN|USDP|USDT|VAI|UST|USTC|AUSD)/.*",
      # FAN
