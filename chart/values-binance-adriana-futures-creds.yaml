  position_adjustment_enable: false
  freqai:
    rl_config:
      train_cycles: 25
      add_state_info: true
      max_trade_duration_candles: 300
      max_training_drawdown_pct: 0.02
      cpu_count: 8
      model_type: PPO
      policy_type: MlpPolicy
      model_reward_parameters:
        rr: 1
        profit_aim: 0.5
    enabled: false
    keras: true
    model_save_type: keras
    identifier: tf_dryrun_0.0.1
    optuna_hyperopt: false
    backtest_period_days: 120
    train_period_days: 360
    conv_width: 2
    expiration_hours: 4
    purge_old_models: 5
    save_backtest_models: true
    track_performance: true
    auto_training_window: true
    write_metrics_to_disk: true
    activate_tensorboard: false
    feature_parameters:
      include_corr_pairlist:
        - BTC/USDT:USDT
      include_timeframes:
        - 1h
        - 4h
      label_period_candles: 12
      DI_threshold: 1
      weight_factor: 0.65
      include_shifted_candles: 5
      indicator_periods_candles:
        - 10
      noise_standard_deviation: 0.1
      buffer_train_data_candles: 20
    data_split_parameters:
      test_size: 0.2
      random_state: 42
      shuffle: false
    model_training_parameters:
      num_lstm_layers: 3
      epochs: 45
      batch_size: 32
      learning_rate: 0.001
      dropout_rate: 0.3
bot:
  enabled: true
  strategy_name: DWT_LongShort
  freqaimodel: LightGBMRegressor
