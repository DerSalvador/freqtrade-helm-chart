kubernetes:
  nodePort: 32335
configcreds:
  listdata:
    enable: false
  downloaddata:
    enable: false
    days: 7
    pairs_to_download: XLM/USDT XDC/USDT XRP/USDT IOTA/USDT ALGO/USDT BTC/USDT ETH/USDT USDC/USDT SOL/USDT FDUSD/USDT ENA/USDT PEPE/USDT WIF/USDT XRP/USDT TRB/USDT
