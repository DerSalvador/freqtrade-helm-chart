# ============================================================================
# Port Management Guidelines
# ============================================================================
# 
# NodePort Range: 30000-32767 (Kubernetes default)
# 
# Recommended Port Allocation:
# - 32000-32099: Reserved for system services
# - 32100-32199: Production bots
# - 32200-32299: Staging bots
# - 32300-32399: Development/testing bots
# - 32400-32499: Monitoring/observability
# - 32500-32999: Available for special use cases
#
# Current Allocations:
# - 32381: bot-ssc-01 (spot trading)
# - 32382: bot-ssc-02 (futures hedging)
# - 32372: bot-mssm-02 (MultiMetricStrategyHF)
# - 32392: multimetricstrategy (MultiMetricStrategy)
#
# ============================================================================

# ============================================================================
# Service Selection Decision Tree
# ============================================================================
#
# Question 1: Do you need external access to the bot API?
#   NO  -> Use ClusterIP only (default, no additional config needed)
#   YES -> Go to Question 2
#
# Question 2: Are you running on a cloud provider with LoadBalancer support?
#   NO  -> Use NodePort
#          Set kubernetes.nodePort: <port>
#   YES -> Go to Question 3
#
# Question 3: Do you need production-grade external access?
#   YES -> Use LoadBalancer
#          Set ingress.enabled: true and ingress.type: LoadBalancer
#   NO  -> Use NodePort for simpler setup
#          Set kubernetes.nodePort: <port>
#
# Question 4: Do you need both direct node access AND load balanced access?
#   YES -> Enable both NodePort and LoadBalancer
#          Set both kubernetes.nodePort and ingress sections
#   NO  -> Choose one based on your primary use case
#
# ============================================================================

# ============================================================================
# Common Use Cases Summary
# ============================================================================
#
# 1. Inter-bot communication only:
#    - ClusterIP (default, always created)
#    - No additional configuration needed
#
# 2. Development/Testing with external access:
#    - ClusterIP + NodePort
#    - Set kubernetes.nodePort
#
# 3. Production on cloud (AWS/GCP/Azure):
#    - ClusterIP + LoadBalancer
#    - Set ingress.enabled: true and ingress.type: LoadBalancer
#
# 4. Production on-premises/bare-metal:
#    - ClusterIP + NodePort
#    - Set kubernetes.nodePort
#    - Consider using MetalLB for LoadBalancer support
#
# 5. High-availability production:
#    - ClusterIP + LoadBalancer + NodePort (backup access)
#    - Set both kubernetes.nodePort and ingress sections
#    - Use LoadBalancer with health checks
#
# 6. Multi-region deployment:
#    - ClusterIP for intra-cluster
#    - LoadBalancer with cross-region annotations
#    - Consider service mesh (Istio/Linkerd) for advanced routing
#
# ============================================================================


