# ============================================================================
# Kubernetes Service Configuration Examples
# ============================================================================
# This file demonstrates different service configuration options for 
# exposing Freqtrade bot deployments
# ============================================================================

# Example 1: ClusterIP Only (Internal Access)
# ============================================================================
# Use this for bots that only need to communicate with other bots in the cluster
# or don't need external access
---
# config:
#   api_server:
#     enabled: true
#     listen_ip_address: 0.0.0.0
#     listen_port: 8084
#     username: freqtrade
#     password: "secure_password_here"
#
# # No kubernetes or ingress section needed
# # Service created: freqtrade-clusterip-<namespace> (ClusterIP)
# # Access: http://freqtrade-clusterip-<namespace>.<namespace>.svc.cluster.local:8084

# Example 2: NodePort Service (Direct External Access)
# ============================================================================
# Use this for development, testing, or when you don't have a LoadBalancer
---
# config:
#   api_server:
#     enabled: true
#     listen_ip_address: 0.0.0.0
#     listen_port: 8084
#     username: freqtrade
#     password: "secure_password_here"
#
# kubernetes:
#   nodePort: 32084  # Must be unique and in range 30000-32767
#
# # Services created:
# # 1. freqtrade-clusterip-<namespace> (ClusterIP)
# # 2. freqtrade-nodeport-<namespace> (NodePort: 32084)
# #
# # Access:
# # - Internal: http://freqtrade-clusterip-<namespace>.<namespace>.svc.cluster.local:8084
# # - External: http://<node-ip>:32084

# Example 3: LoadBalancer Service (Cloud-Native External Access)
# ============================================================================
# Use this for production deployments on cloud providers (AWS, GCP, Azure, etc.)
---
# config:
#   api_server:
#     enabled: true
#     listen_ip_address: 0.0.0.0
#     listen_port: 8084
#     username: freqtrade
#     password: "secure_password_here"
#
# ingress:
#   enabled: true
#   type: LoadBalancer
#   annotations: {}
#     # AWS Examples:
#     # service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
#     # service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
#     # service.beta.kubernetes.io/aws-load-balancer-internal: "true"
#     #
#     # GCP Examples:
#     # cloud.google.com/load-balancer-type: "Internal"
#     # networking.gke.io/load-balancer-type: "Internal"
#     #
#     # Azure Examples:
#     # service.beta.kubernetes.io/azure-load-balancer-internal: "true"
#     # service.beta.kubernetes.io/azure-load-balancer-internal-subnet: "subnet-name"
#   loadBalancerIP: ""  # Optional: specify a static IP address
#
# # Services created:
# # 1. freqtrade-clusterip-<namespace> (ClusterIP)
# # 2. freqtrade-loadbalancer-<namespace> (LoadBalancer)
# #
# # Access:
# # - Internal: http://freqtrade-clusterip-<namespace>.<namespace>.svc.cluster.local:8084
# # - External: http://<load-balancer-ip>:8084

