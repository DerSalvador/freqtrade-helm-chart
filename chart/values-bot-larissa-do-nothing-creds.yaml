---
kubernetes:
  nodePort: 31001
configcreds:
  edge:
    enabled: false
    process_throttle_secs: 3600
    calculate_since_number_of_days: 365
    allowed_risk: 0.01
    stoploss_range_min: -0.02
    stoploss_range_max: -0.1
    stoploss_range_step: -0.01
    minimum_winrate: 0.02
    minimum_expectancy: 0.05
    min_trade_number: 5
    max_trade_duration_minute: 7440
    remove_pumps: false
    hoursInThePast: "-8760h" # 1 year  
