  bot_name: bot-larissa-do-nothing
  dry_run: true
  dry_run_wallet: 50000
  timeframe: 5m
  available_capital: 50000
  max_open_trades: 100
  stake_amount: unlimited
  minimal_roi:
    "0": 0.1
  stoploss: -0.11
  download_trades: false
  use_custom_stoploss: true
  use_exit_signal: true
  trailing_stop: true
  trailing_only_offset_is_reached: true
  trailing_stop_positive: 0.03
  trailing_stop_positive_offset: 0.04
  trading_mode: futures
  margin_mode: isolated
  position_adjustment_enable: false
  pairlists:
    - method: RemotePairList
      number_assets: 50
      pairlist_url: http://filekeys.com/remotepairlist-white-futures-static.json  # http://filekeys.com/remotepairlist-white-futures.json   # https://remotepairlist.com?q=6ed672791d1040c0
      mode: whitelist
      processing_mode: append
      refresh_period: 900
      keep_pairlist_on_failure: true
      read_timeout: 120      
    - method: RemotePairList
      number_assets: 50
      pairlist_url: https://remotepairlist.com?q=6ed672791d1040c0 # http://filekeys.com/remotepairlist-white-futures.json   # https://remotepairlist.com?q=6ed672791d1040c0
      mode: whitelist
      processing_mode: append
      refresh_period: 900
      keep_pairlist_on_failure: true
      read_timeout: 120
    - method: RemotePairList
      number_assets: 50
      mode: blacklist
      pairlist_url: https://remotepairlist.com?q=3e362027334fd860
      processing_mode: append
      refresh_period: 900
      keep_pairlist_on_failure: true
      read_timeout: 120
    - method: AgeFilter
      min_days_listed: 30
    - method: PriceFilter
      low_price_ratio: 0.003
      min_price: 1
    - method: SpreadFilter
      max_spread_ratio: 0.005
    - method: RangeStabilityFilter
      lookback_days: 3
      min_rate_of_change: 0.03
      refresh_period: 1800
    - method: ShuffleFilter  
