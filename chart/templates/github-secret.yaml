apiVersion: v1
data:
  .dockerconfigjson: 
kind: Secret
metadata:
  name: deploy-key-gcr
type: kubernetes.io/dockerconfigjson

apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.configcreds.imagePullSecrets_github.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf "{\"auths\":{\"ghcr.io\":{\"username\":\"%s\",\"password\":\"%s\",\"email\":\"%s\",\"auth\":\"%s\"}}}" .Values.configcreds.imagePullSecrets_github.username .Values.configcreds.imagePullSecrets_github.password .Values.configcreds.imagePullSecrets_github.email (printf "%s:%s" .Values.configcreds.imagePullSecrets_github.username .Values.configcreds.imagePullSecrets_github.password | b64enc) | b64enc }}
