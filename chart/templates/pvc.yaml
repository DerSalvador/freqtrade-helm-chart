---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: freqtrade-sqlite-{{ .Release.Namespace }}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.bot.pvc_size }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: freqtrade-extra-strategies-{{ .Release.Namespace }}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.bot.pvc_size }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: freqtrade-user-data-{{ .Release.Namespace }}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.bot.pvc_size }}
---     
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: freqtrade-backtesting-data-{{ .Release.Namespace }}
spec:   
  accessModes:
  - ReadWriteOnce
  resources: 
    requests:
      storage: {{ .Values.backtesting.pvc_size }}
---     
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: freqtrade-backtesting-results-{{ .Release.Namespace }}
spec:     
  accessModes:
  - ReadWriteOnce
  resources:
    requests: 
      storage: {{ .Values.backtesting.results.pvc_size }}
