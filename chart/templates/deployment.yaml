{{- if .Values.bot.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: freqtrade-{{ .Release.Namespace }}
  labels:
    app: freqtrade
    env: production   # Adding a label named env with value production
spec:
  selector:
    matchLabels:
      app: freqtrade-{{ .Release.Namespace }}
  template:
    metadata:
      labels:
        app: freqtrade-{{ .Release.Namespace }}
        reason: trading
    spec:
      # nodeName: {{ .Values.kubernetes.nodeNameBackTestingResultsReader }} # pool-dersalvador-y5w2t # pool-dersalvador-ylyw0
      #
      # 1. Set permissions to files, otherwise not starting
      #
      initContainers:
      - name: take-sqlite-dir-ownership
        image: {{ .Values.image.base }}:{{ .Values.image.tag }}
        securityContext:
          allowPrivilegeEscalation: false
          runAsUser: 0
        command:
        - bash
        - -c
        - |
          rm -rf /extra_strategies/lost+found
          mkdir -p /tmp/NNPredict 
          echo chown -R ftuser:ftuser /tmp 
          echo chown -R ftuser:ftuser /sqlite 
          echo chown -R ftuser:ftuser /freqtrade
          echo chown -R ftuser:ftuser /extra_strategies
          # echo chown -R ftuser:ftuser /extra_strategies
          # echo chmod -R 777 /extra_strategies
          mkdir -p /extra_strategies/logs 
          chown -R ftuser:ftuser /sqlite 
          chown -R ftuser:ftuser /freqtrade
          chown -R ftuser:ftuser /extra_strategies
          chmod -R 777 /extra_strategies
          chmod -R 777 /tmp
          find /tmp
          find /sqlite
          find /extra_strategies/logs 
        volumeMounts:
        - name: tmp
          mountPath: /tmp
          readOnly: false            
        - name: extra-strategies
          mountPath: /extra_strategies
          readOnly: false          
        - mountPath: /sqlite
          name: sqlite
      #
      # 2. Copy Extra Strategies to userdata strategies
      # 
{{- if .Values.kubernetes.copyContainer }}          
      - name: copy-strategy-to-default
        image: {{ .Values.image.base }}:{{ .Values.image.tag }}
        securityContext:
          allowPrivilegeEscalation: false
          runAsUser: 0
        command: 
        - sh
        - -c
        - |
          set -x
          # echo cp /extra_strategies/utils/sklearn.utils.__init__.py /home/ftuser/.local/lib/python3.12/site-packages/sklearn/utils/__init__.py
          # cp /extra_strategies/utils/sklearn.utils.__init__.py /home/ftuser/.local/lib/python3.12/site-packages/sklearn/utils/__init__.py
          # echo cp -r /home/ftuser/.local/lib/python3.12/site-packages/sklearn /extra_strategies
          # cp -r /home/ftuser/.local/lib/python3.12/site-packages/sklearn /extra_strategies
          # echo cp /extra_strategies/utils/sklearn.utils.__init__.py /extra_strategies/sklearn/utils/__init__.py
          # cp /extra_strategies/utils/sklearn.utils.__init__.py /extra_strategies/sklearn/utils/__init__.py
          echo cp -r /extra_strategies/* /freqtrade/user_data/strategies/
          mkdir -p /freqtrade/user_data/strategies/
          cp -r /extra_strategies/* /freqtrade/user_data/strategies/
          echo find /extra_strategies
          find /extra_strategies
          echo Strategy {{ .Values.bot.strategy_name }} in /extra_strategies
          # cat /extra_strategies/{{ .Values.bot.strategy_name }}*
          # echo "Strategy {{ .Values.bot.strategy_name }} in /freqtrade/user_data/strategies"
          # cat /freqtrade/user_data/strategies/{{ .Values.bot.strategy_name }}* 
          # echo ""
          # echo cp /extra_strategies/utils/sklearn.utils.__init__.py /home/ftuser/.local/lib/python3.12/site-packages/sklearn/utils/__init__.py
          # cp /extra_strategies/utils/sklearn.utils.__init__.py /home/ftuser/.local/lib/python3.12/site-packages/sklearn/utils/__init__.py
          # echo cat /home/ftuser/.local/lib/python3.12/site-packages/sklearn/utils/_optional_dependencies.py >> /home/ftuser/.local/lib/python3.12/site-packages/sklearn/utils/__init__.py
          # cat /home/ftuser/.local/lib/python3.12/site-packages/sklearn/utils/_optional_dependencies.py >> /home/ftuser/.local/lib/python3.12/site-packages/sklearn/utils/__init__.py
          # cat /home/ftuser/.local/lib/python3.12/site-packages/sklearn/utils/__init__.py
          # sleep 30
        volumeMounts:
        - name: extra-strategies
          mountPath: /extra_strategies
          readOnly: false          
{{- end }}
      - name: liststrategies
        image: {{ .Values.image.base }}:{{ .Values.image.tag }}
        command:
        - freqtrade
        args:
        - list-strategies
{{- if .Values.bot.debug }}
        - {{ .Values.bot.debuglevel }}
{{- end }}
        - --recursive-strategy-search
        - --strategy-path
        - /extra_strategies
        - --config
        - /freqtrade/config/config-{{ .Release.Namespace }}.json
        - --config
        - /freqtrade/configcreds/configcreds-{{ .Release.Namespace }}.json
        - -d 
        - "/extra_strategies/data"
        # - "/extra_strategies/data/{{ .Values.configcreds.exchange.name }}/{{ .Values.configcreds.trading_mode }}"
        - --userdir
        - /freqtrade/user_data      
        - --logfile
        - /extra_strategies/logs/liststrategies_{{ now | date "20060102" }}.log
        volumeMounts:
        - name: configcreds
          mountPath: /freqtrade/configcreds
        - name: config
          mountPath: /freqtrade/config
        - name: sqlite
          mountPath: /sqlite
        - name: extra-strategies
          mountPath: /extra_strategies
          readOnly: false 
      # 3. Download Trade Data for backtesting and Hyperopting
      # Spot: freqtrade download-data --prepend --new-pairs-days 30 -p BTC/USDT ETH/USDT --days 365 --exchange binance -t 1m 5m 15m 1h
