      # 
{{- if .Values.configcreds.dersalvador.ds_backtesting.enable  | default false}}
      - name: backtesting
        image: {{ .Values.image.base }}:{{ .Values.image.tag }}
        command:
        - freqtrade
        args:
        - backtesting
        - --export-filename
        - "/extra_strategies/data/{{ .Values.configcreds.exchange.name }}/{{ .Values.configcreds.trading_mode }}/backtest_result_{{ now | date "20060102" }}.json"
        - --breakdown 
        - day 
        - week
        - --export 
        - {{ .Values.configcreds.backtesting.exportType }}
        - --strategy-list 
        - DWT_LongShort 
        - TaSearchLevelG15m 
        - --timerange 
        - {{ now | dateModify .Values.configcreds.backtesting.hoursInThePast | date "20060102"  }}-{{ now | date "20060102" }} 
        - --config
        - /freqtrade/config/config-{{ .Release.Namespace }}.json
