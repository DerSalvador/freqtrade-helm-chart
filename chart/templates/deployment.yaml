      - name: take-sqlite-dir-ownership
        image: {{ .Values.image.base }}:{{ .Values.image.tag }}
        securityContext:
          allowPrivilegeEscalation: false
          runAsUser: 0
        command:
        - bash
        args: ["-c","chown -R ftuser:ftuser /sqlite; chown -R ftuser:ftuser /freqtrade; find /sqlite" ] 
        volumeMounts:
        - mountPath: /sqlite
          name: sqlite
      - name: copy-strategy-to-default
        image: {{ .Values.image.base }}:{{ .Values.image.tag }}
        securityContext:
          allowPrivilegeEscalation: false
          runAsUser: 0
        command: 
        - sh
        - -c
        - |
          echo rm -f /home/ftuser/.local/lib/python3.11/site-packages/freqtrade.pth
          rm -f /home/ftuser/.local/lib/python3.11/site-packages/freqtrade.pth
          echo rm -rf /freqtrade/user_data/strategies/*; 
          rm -rf /freqtrade/user_data/strategies/*; 
          echo rm -f /extra_strategies/MasterMoniGoManiHyperStrategy*
          rm -f /extra_strategies/MasterMoniGoManiHyperStrategy*
          echo rm -f /freqtrade/user_data/strategies/MasterMoniGoManiHyperStrategy*
          rm -f /freqtrade/user_data/strategies/MasterMoniGoManiHyperStrategy*
          echo Copying strategy {{ .Values.bot.strategy_name }} to default path;  
          # cp -r /extra_strategies/{{ .Values.bot.strategy_name }}* /freqtrade/user_data/strategies/; 
          # cp -r /extra_strategies/models* /freqtrade/user_data/strategies/;
          cp -r /extra_strategies/* /freqtrade/user_data/strategies/;
          find /freqtrade/user_data/strategies/;
          # cp -r /freqtrade/freqtrade/utils /freqtrade/user_data/strategies/;
          # find  /freqtrade/user_data/strategies/utils;
        volumeMounts:
        # - name: freqtrade-pythonpath 
        #   subPath: freqtrade.pth
        #   mountPath: /home/ftuser/.local/lib/python3.11/site-packages/freqtrade.pth
        #   readOnly: false
        # - name: user-data
        #   subPath: freqtrade.pth
        #   mountPath: /home/ftuser/.local/lib/python3.11/site-packages/
        #   readOnly: false
        - name: strategies-default
          mountPath: /freqtrade/user_data/strategies
          readOnly: false
        # - name: extra-strategies
        #   mountPath: /extra_strategies
        #   readOnly: false        
      - name: freqtrade-list-strategies-{{ .Release.Namespace }}
        image: {{ .Values.image.base }}:{{ .Values.image.tag }}
        command:
        - freqtrade
        args:
        - list-strategies
        - --recursive-strategy-search
        # - --strategy-path
        # - /freqtrade/user_data/extra_strategies        
{{- if .Values.bot.debug }}
        - {{ .Values.bot.debuglevel }}
{{- end }}
        - --config
        - /freqtrade/config/config-{{ .Release.Namespace }}.json
        - --config
        - /freqtrade/configcreds/configcreds-{{ .Release.Namespace }}.json
        volumeMounts:
        # - name: freqtrade-pythonpath 
        #   subPath: freqtrade.pth
        #   mountPath: /home/ftuser/.local/lib/python3.11/site-packages/freqtrade.pth
        #   readOnly: false
        # - name: user-data
        #   subPath: freqtrade.pth
        #   mountPath: /home/ftuser/.local/lib/python3.11/site-packages/
        #   readOnly: false
        - name: strategies-default
          mountPath: /freqtrade/user_data/strategies
          readOnly: false        
        # - name: extra-strategies
        #   mountPath: /extra_strategies
        #   readOnly: false      
        - name: configcreds
          mountPath: /freqtrade/configcreds
        - name: config
          mountPath: /freqtrade/config
        - name: sqlite
          mountPath: /sqlite          
      - name: freqtrade-strategy-updater-{{ .Release.Namespace }}
        image: {{ .Values.image.base }}:{{ .Values.image.tag }}
        command:
        - freqtrade
        args:
        - strategy-updater
{{- if .Values.bot.debug }}
        - {{ .Values.bot.debuglevel }}
{{- end }}
        # - --strategy-path
        # - /freqtrade/user_data/extra_strategies
        - --strategy-list
        - {{ .Values.bot.strategy_name }}
        - --recursive-strategy-search
        - --log-file 
        - /tmp/freqtrade.log
        - --data-dir
        - /freqtrade/user_data/data
        volumeMounts:
        # - name: freqtrade-pythonpath 
        #   subPath: freqtrade.pth
        #   mountPath: /home/ftuser/.local/lib/python3.11/site-packages/freqtrade.pth
        #   readOnly: false
        # - name: user-data
        #   subPath: freqtrade.pth
        #   mountPath: /home/ftuser/.local/lib/python3.11/site-packages/
        #   readOnly: false      
        - name: strategies-default
          mountPath: /freqtrade/user_data/strategies
          readOnly: false
        # - name: extra-strategies
        #   mountPath: /extra_strategies
        #   readOnly: false  
      - name: freqtrade-test-pairs-{{ .Release.Namespace }}
        image: {{ .Values.image.base }}:{{ .Values.image.tag }}
        command:
        - freqtrade
        args:
        - test-pairlist
{{- if .Values.bot.debug }}
        - {{ .Values.bot.debuglevel }}
{{- end }}
        - --config
        - /freqtrade/config/config-{{ .Release.Namespace }}.json
        - --config
        - /freqtrade/configcreds/configcreds-{{ .Release.Namespace }}.json
        volumeMounts:
        # - name: freqtrade-pythonpath 
        #   subPath: freqtrade.pth
        #   mountPath: /home/ftuser/.local/lib/python3.11/site-packages/freqtrade.pth
        #   readOnly: false
        # - name: user-data
        #   subPath: freqtrade.pth
        #   mountPath: /home/ftuser/.local/lib/python3.11/site-packages/
        #   readOnly: false        
        - name: strategies-default
          mountPath: /freqtrade/user_data/strategies
          readOnly: false
        # - name: extra-strategies
        #   mountPath: /extra_strategies
        #   readOnly: false  
        - name: configcreds
          mountPath: /freqtrade/configcreds
        - name: config
          mountPath: /freqtrade/config
      containers:
      - name: freqtrade-{{ .Release.Namespace }}
        image: {{ .Values.image.base }}:{{ .Values.image.tag }}
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh","-c","sleep 60"]
        command:
        - freqtrade
        args:
        - trade
{{- if .Values.bot.debug }}
        - {{ .Values.bot.debuglevel }}
{{- end }}
        - --config
        - /freqtrade/config/config-{{ .Release.Namespace }}.json
        - --config
        - /freqtrade/configcreds/configcreds-{{ .Release.Namespace }}.json
        # - --strategy-path
        # - /freqtrade/user_data/extra_strategies
        - --strategy
        - {{ .Values.bot.strategy_name }}
        - --db-url
        - sqlite:////sqlite/tradesv3.sqlite
        - --recursive-strategy-search
        - --freqaimodel 
        - {{ .Values.bot.freqaimodel }}
        - --freqaimodel-path 
        - /freqtrade/freqtrade/freqai/prediction_models
        - --log-file 
        - /tmp/freqtrade.log
        - --data-dir
        - /freqtrade/user_data/data
        volumeMounts:
        # - name: freqtrade-pythonpath 
        #   subPath: freqtrade.pth
        #   mountPath: /home/ftuser/.local/lib/python3.11/site-packages/freqtrade.pth
        #   readOnly: false
        # - name: user-data
        #   subPath: freqtrade.pth
        #   mountPath: /home/ftuser/.local/lib/python3.11/site-packages/
        #   readOnly: false    
        # - name: nfi-hold-trades
        #   subPath: nfi-hold-trades.json
        #   mountPath: /freqtrade/user_data/nfi-hold-trades.json
        #   readOnly: false
        # - name: user-data
        #   subPath: nfi-hold-trades.json
        #   mountPath: /freqtrade/user_data
        #   readOnly: false
        - name: user-data
          mountPath: /freqtrade/user_data
          readOnly: false   
        - name: strategies-default
          mountPath: /freqtrade/user_data/strategies
          readOnly: false
        # - name: extra-strategies
        #   mountPath: /extra_strategies
        #   readOnly: false      
        - name: configcreds
          mountPath: /freqtrade/configcreds
        - name: config
          mountPath: /freqtrade/config
        - name: sqlite
          mountPath: /sqlite
        ports:
        - name: api
          containerPort: {{ .Values.config.api_server.listen_port }}
      imagePullSecrets:
      - name: deploy-key-gcr
      volumes:
      - name: strategies-default
        persistentVolumeClaim:
          claimName: freqtrade-strategies   
      - name: user-data
        persistentVolumeClaim:
          claimName: freqtrade-user-data
      # - name: extra-strategies
      #   persistentVolumeClaim:
      #     claimName: freqtrade-extra-strategies
      - name: configcreds
        configMap:
          name: freqtrade-config-creds-{{ .Release.Namespace }}
      - name: nfi-hold-trades
        configMap:
          name: freqtrade-nfi-hold-trades-{{ .Release.Namespace }}
      - name: config
        configMap:
          name: freqtrade-config-{{ .Release.Namespace }}
      - name: sqlite
        persistentVolumeClaim:
          claimName: freqtrade-sqlite
      - name: freqtrade-pythonpath
        persistentVolumeClaim:
          claimName: freqtrade-pythonpath         
---
{{- end }}
