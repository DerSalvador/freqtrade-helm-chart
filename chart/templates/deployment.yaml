#         args:
#         - strategy-updater
# {{- if .Values.bot.debug }}
#         - {{ .Values.bot.debuglevel }}
# {{- end }}
#         - --strategy-list
#         - {{ .Values.bot.strategy_name }}
#         # - --recursive-strategy-search
#         - --strategy-path
#         - /extra_strategies
#         - --log-file 
#         - /tmp/freqtrade.log
#         - --datadir
#         - /freqtrade/user_data/data
#         - --userdir
#         - /freqtrade/user_data 
#         volumeMounts:         
#         - name: extra-strategies
#           mountPath: /extra_strategies
#           readOnly: false          
# STRATGEY UPDATER END             
#       - name: freqtrade-test-pairs-{{ .Release.Namespace }}
#         image: {{ .Values.image.base }}:{{ .Values.image.tag }}
#         command:
#         - freqtrade
#         args:
#         - test-pairlist
# {{- if .Values.bot.debug }}
#         - {{ .Values.bot.debuglevel }}
# {{- end }}
#         - --config
#         - /freqtrade/config/config-{{ .Release.Namespace }}.json
#         - --config
#         - /freqtrade/configcreds/configcreds-{{ .Release.Namespace }}.json
#         volumeMounts:
#         # - name: extra-strategies
#         #   mountPath: /extra_strategies
#         #   readOnly: false             
#         - name: strategies-default
#           mountPath: /freqtrade/user_data/strategies
#           readOnly: false
#         - name: configcreds
#           mountPath: /freqtrade/configcreds
#         - name: config
#           mountPath: /freqtrade/config

      #
      # Main Process, Trading
      # 
      containers:
      # 
      # Debug Container
      #
      - name: debug-container
        image: {{ .Values.image.base }}:{{ .Values.image.tag }}
        # command: ["/bin/sleep", "3600"]
        # Sleep command to keep the container running for debugging purposes
        # Add any additional commands or tools you need for debugging
        # For example:
        command:
        - bash 
        - -c 
        - |
          echo 'Debug container running...'; 
          # sleep 30
          # cat /home/ftuser/.local/lib/python3.12/site-packages/sklearn/utils/_optional_dependencies.py >> /home/ftuser/.local/lib/python3.12/site-packages/sklearn/utils/__init__.py
          # cat /home/ftuser/.local/lib/python3.12/site-packages/sklearn/utils/__init__.py
          while true; do sleep 10; done;
        workingDir: /extra_strategies
        # Set the working directory if needed
          
        volumeMounts:
        - name: extra-strategies
          mountPath: /extra_strategies
          readOnly: false          
        - name: configcreds
          mountPath: /freqtrade/configcreds
        - name: config
          mountPath: /freqtrade/config
        - name: sqlite
          mountPath: /sqlite
      - name: freqtrade
        image: {{ .Values.image.base }}:{{ .Values.image.tag }}
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh","-c","sleep 60"]
        command:
        - freqtrade
        args:
        - trade
{{- if .Values.bot.debug }}
        - {{ .Values.bot.debuglevel }}
{{- end }}
        - --config
        - /freqtrade/config/config-{{ .Release.Namespace }}.json
        - --config
        - /freqtrade/configcreds/configcreds-{{ .Release.Namespace }}.json
        - --strategy-path
        - /extra_strategies
        - --strategy
        - {{ .Values.bot.strategy_name }}
        - --db-url
        - sqlite:////sqlite/tradesv3.sqlite
        - --recursive-strategy-search
        - --freqaimodel 
        - {{ .Values.bot.freqaimodel }}
        - --freqaimodel-path 
        - /freqtrade/freqtrade/freqai/prediction_models
        - --logfile
        - /extra_strategies/logs/freqtrade_{{ now | date "20060102" }}.log
        - --datadir
        - "/extra_strategies/data"
        - --userdir
        - /freqtrade/user_data 
        volumeMounts:
        - name: extra-strategies
          mountPath: /extra_strategies
          readOnly: false          
        - name: configcreds
          mountPath: /freqtrade/configcreds
        - name: config
          mountPath: /freqtrade/config
        - name: sqlite
          mountPath: /sqlite
        ports:
        - name: api
          containerPort: {{ .Values.config.api_server.listen_port }}
      imagePullSecrets:
      - name: deploy-key-gcr
      volumes:
      - name: extra-strategies
        persistentVolumeClaim:
          claimName: freqtrade-extra-strategies   
      - name: configcreds
        configMap:
          name: freqtrade-config-creds-{{ .Release.Namespace }}
      - name: nfi-hold-trades
        configMap:
          name: freqtrade-nfi-hold-trades-{{ .Release.Namespace }}
      - name: config
        configMap:
          name: freqtrade-config-{{ .Release.Namespace }}
      - name: sqlite
        persistentVolumeClaim:
          claimName: freqtrade-sqlite      
---
{{- end }}
