      # Hyperopting
      # freqtrade hyperopt --strategy DWT_LongShort -c config/config-bot-larissa-do-nothing.json -c configcreds/configcreds-bot-larissa-do-nothing.json --hyperopt-loss ShortTradeDurHyperOptLoss
      # 
      # - --timeframe-detail {{ .Values.configcreds.timeframe }} 
{{- if .Values.configcreds.dersalvador.ds_hyperopt.enable | default false}}
      - name: hyperopt
        image: {{ .Values.image.base }}:{{ .Values.image.tag }}
        command:
        - freqtrade
        args:
        - hyperopt
        - --timeframe
        - {{ .Values.configcreds.timeframe }}
        - --ignore-missing-spaces
        - --analyze-per-epoch
        - --timerange 
        - {{ now | dateModify .Values.configcreds.backtesting.hoursInThePast | date "20060102"  }}-{{ now | date "20060102" }} 
        - --print-json
        - --print-all
        - --epochs 
        - "150"
        - --random-state 
        - "111"
        - --fee 
        - "0.01"
{{- if .Values.configcreds.dersalvador.ds_hyperopt.enableprotections }}
        - --enable-protections
{{- end }}
        - --min-trades 
        - "{{ .Values.configcreds.max_open_trades }}"
        - --spaces 
        - roi
        - stoploss
        - trailing
        - trades
        - --config
        - /freqtrade/config/config-{{ .Release.Namespace }}.json
        - --config
        - /freqtrade/configcreds/configcreds-{{ .Release.Namespace }}.json
        - --strategy-path
        - /extra_strategies
        - --strategy
        - {{ .Values.bot.strategy_name }}
        - --hyperopt-loss 
        - {{ .Values.ds_hyperopt.hyperlossfunction }}
        - -d 
        - "/extra_strategies/data"
        - --logfile
        - /extra_strategies/logs/hyperopt_{{ now | date "20060102" }}.log
        volumeMounts:
        - name: tmp
          mountPath: /tmp
          readOnly: false          
        - name: extra-strategies
          mountPath: /extra_strategies
          readOnly: false          
        - name: configcreds
          mountPath: /freqtrade/configcreds
        - name: config
          mountPath: /freqtrade/config
        - name: sqlite
          mountPath: /sqlite
{{- end }}
