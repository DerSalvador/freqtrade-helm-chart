---
{{- if .Values.bot.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: freqtrade-{{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: freqtrade-{{ .Release.Namespace }}
  template:
    metadata:
      labels:
        app: freqtrade-{{ .Release.Namespace }}
    spec:
      # nodeName: {{ .Values.kubernetes.nodeNameBackTestingResultsReader }} # pool-dersalvador-y5w2t # pool-dersalvador-ylyw0
      initContainers:
      - name: copy-configmap-files-to-default
        image: {{ .Values.image.base }}:{{ .Values.image.tag }}
        securityContext:
          allowPrivilegeEscalation: false
          runAsUser: 0
        command:
        - bash
        args: ["-c","find /strategies-data-configmap/ -name '*' -type f -exec cp {} /freqtrade/user_data/strategies/ ';'; find /freqtrade/user_data/extra_strategies/; find /freqtrade/user_data/strategies/" ] 
        volumeMounts:
        - mountPath: /freqtrade/user_data/strategies
          name: strategies-default
          readOnly: false
        - name: configmap-strategies
          mountPath: /strategies-data-configmap
          readOnly: false
        - name: extra-strategies
          mountPath: /freqtrade/user_data/extra_strategies
          readOnly: false          
      - name: take-sqlite-dir-ownership
        image: {{ .Values.image.base }}:{{ .Values.image.tag }}
        securityContext:
          allowPrivilegeEscalation: false
          runAsUser: 0
        command:
        - bash
        args: ["-c","chown -R ftuser:ftuser /sqlite; chown -R ftuser:ftuser /freqtrade; find /sqlite" ] 
        volumeMounts:
        - mountPath: /sqlite
          name: sqlite
