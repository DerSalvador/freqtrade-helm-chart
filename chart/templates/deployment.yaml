{{- if .Values.bot.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: freqtrade-{{ .Release.Namespace }}
  labels:
    app: freqtrade
    env: production   # Adding a label named env with value production
spec:
  selector:
    matchLabels:
      app: freqtrade-{{ .Release.Namespace }}
  template:
    metadata:
      labels:
        app: freqtrade-{{ .Release.Namespace }}
        reason: trading
    spec:
      # nodeName: {{ .Values.kubernetes.nodeNameBackTestingResultsReader }} # pool-dersalvador-y5w2t # pool-dersalvador-ylyw0
      #
      # 1. Set permissions to files, otherwise not starting
      #
      initContainers:
      - name: take-sqlite-dir-ownership
        image: {{ .Values.image.base }}:{{ .Values.image.tag }}
        securityContext:
          allowPrivilegeEscalation: false
          runAsUser: 0
        command:
        - bash
        - -c
        - |
          rm -rf /extra_strategies/lost+found
          echo chown -R ftuser:ftuser /sqlite 
          echo chown -R ftuser:ftuser /freqtrade
          echo chown -R ftuser:ftuser /extra_strategies
          # echo chown -R ftuser:ftuser /extra_strategies
          # echo chmod -R 777 /extra_strategies
          mkdir -p /extra_strategies/logs 
          chown -R ftuser:ftuser /sqlite 
          chown -R ftuser:ftuser /freqtrade
          chown -R ftuser:ftuser /extra_strategies
          chmod -R 777 /extra_strategies
          find /sqlite
          find /extra_strategies/logs 
        volumeMounts:
        - name: extra-strategies
          mountPath: /extra_strategies
          readOnly: false          
        - mountPath: /sqlite
          name: sqlite
      #
      # 2. Copy Extra Strategies to userdata strategies
      # 
{{- if .Values.kubernetes.copyContainer }}          
      - name: copy-strategy-to-default
        image: {{ .Values.image.base }}:{{ .Values.image.tag }}
        securityContext:
          allowPrivilegeEscalation: false
          runAsUser: 0
        command: 
        - sh
        - -c
        - |
          set -x
          # echo cp /extra_strategies/utils/sklearn.utils.__init__.py /home/ftuser/.local/lib/python3.12/site-packages/sklearn/utils/__init__.py
          # cp /extra_strategies/utils/sklearn.utils.__init__.py /home/ftuser/.local/lib/python3.12/site-packages/sklearn/utils/__init__.py
          # echo cp -r /home/ftuser/.local/lib/python3.12/site-packages/sklearn /extra_strategies
          # cp -r /home/ftuser/.local/lib/python3.12/site-packages/sklearn /extra_strategies
          # echo cp /extra_strategies/utils/sklearn.utils.__init__.py /extra_strategies/sklearn/utils/__init__.py
          # cp /extra_strategies/utils/sklearn.utils.__init__.py /extra_strategies/sklearn/utils/__init__.py
          echo cp -r /extra_strategies/* /freqtrade/user_data/strategies/
          cp -r /extra_strategies/* /freqtrade/user_data/strategies/
          echo find /extra_strategies
          find /extra_strategies
          echo Strategy {{ .Values.bot.strategy_name }} in /extra_strategies
          cat /extra_strategies/{{ .Values.bot.strategy_name }}*
          echo "Strategy {{ .Values.bot.strategy_name }} in /freqtrade/user_data/strategies"
          cat /freqtrade/user_data/strategies/{{ .Values.bot.strategy_name }}* 
          echo ""
          # echo cp /extra_strategies/utils/sklearn.utils.__init__.py /home/ftuser/.local/lib/python3.12/site-packages/sklearn/utils/__init__.py
          # cp /extra_strategies/utils/sklearn.utils.__init__.py /home/ftuser/.local/lib/python3.12/site-packages/sklearn/utils/__init__.py
          # echo cat /home/ftuser/.local/lib/python3.12/site-packages/sklearn/utils/_optional_dependencies.py >> /home/ftuser/.local/lib/python3.12/site-packages/sklearn/utils/__init__.py
          # cat /home/ftuser/.local/lib/python3.12/site-packages/sklearn/utils/_optional_dependencies.py >> /home/ftuser/.local/lib/python3.12/site-packages/sklearn/utils/__init__.py
          # cat /home/ftuser/.local/lib/python3.12/site-packages/sklearn/utils/__init__.py
          # sleep 30
        volumeMounts:
        - name: extra-strategies
          mountPath: /extra_strategies
          readOnly: false          
{{- end }}
      - name: liststrategies
        image: {{ .Values.image.base }}:{{ .Values.image.tag }}
        command:
        - freqtrade
        args:
        - list-strategies
{{- if .Values.bot.debug }}
        - {{ .Values.bot.debuglevel }}
{{- end }}
        - --recursive-strategy-search
        - --strategy-path
        - /extra_strategies
        - --config
        - /freqtrade/config/config-{{ .Release.Namespace }}.json
        - --config
        - /freqtrade/configcreds/configcreds-{{ .Release.Namespace }}.json
        - -d 
        - "/extra_strategies/data"
        # - "/extra_strategies/data/{{ .Values.configcreds.exchange.name }}/{{ .Values.configcreds.trading_mode }}"
        - --userdir
        - /freqtrade/user_data      
        - --logfile
        - /extra_strategies/logs/liststrategies_{{ now | date "20060102" }}.log
        volumeMounts:
        - name: configcreds
          mountPath: /freqtrade/configcreds
        - name: config
          mountPath: /freqtrade/config
        - name: sqlite
          mountPath: /sqlite
        - name: extra-strategies
          mountPath: /extra_strategies
          readOnly: false 
      # 3. Download Trade Data for backtesting and Hyperopting
      # Spot: freqtrade download-data --prepend --new-pairs-days 30 -p BTC/USDT ETH/USDT --days 365 --exchange binance -t 1m 5m 15m 1h
      # Futures: freqtrade download-data --prepend -p BTC/USDT:USDT ETH/USDT:USDT --days 1024 --exchange binance -t 1m 5m 15m 1h --trading-mode futures
      # - {{ .Values.config.pairs_to_download }}
{{- if .Values.dersalvador.ds_downloaddata.enable  | default false}}
      - name: downloaddata
        image: {{ .Values.image.base }}:{{ .Values.image.tag }}
        command:
        - freqtrade
        args:
        - download-data
        - --erase
        - --prepend 
        - -p 
        - "XLM/USDT:USDT"
        - "XRP/USDT:USDT"
        - "IOTA/USDT:USDT"
        - "ALGO/USDT:USDT"
        - "BTC/USDT:USDT"
        - "ETH/USDT:USDT"
        - "SOL/USDT:USDT"
        - "FDUSD/USDT:USDT"
        - "ENA/USDT:USDT"
        - "WIF/USDT:USDT"
        - "PEPE/USDT:USDT"
        - "BCH/USD:USDT"
        - "LTC/USDT:USDT"
        - --days 
        - "{{ .Values.configcreds.downloaddata.days }}"
        - --exchange 
        - {{ .Values.configcreds.exchange.name }} 
        - -t 
        - {{ .Values.configcreds.timeframe }} 
        - --trading-mode 
        - {{ .Values.configcreds.trading_mode }}
        - -d 
        - /extra_strategies/data
        - --logfile
        - /extra_strategies/logs/downloaddata_{{ now | date "20060102" }}.log
        # - "/extra_strategies/data/{{ .Values.config.exchange.name }}/{{ .Values.configcreds.trading_mode }}"
        volumeMounts:
        - name: extra-strategies
          mountPath: /extra_strategies
          readOnly: false          
        - name: configcreds
          mountPath: /freqtrade/configcreds
        - name: config
          mountPath: /freqtrade/config
{{- end }}

      # List download data 
      #
      # freqtrade list-data --exchange binance -p BTC/USDT:USDT --show-timerange --trading-mode futures
      # freqtrade list-data -d /extra_strategies/data/binance/futures/ --exchange binance -p SOL/USDT:USDT --show-timerange
{{- if .Values.dersalvador.ds_listdata.enable  | default false}}
      - name: listdata
        image: {{ .Values.image.base }}:{{ .Values.image.tag }}
        command:
        - freqtrade
        args:
        - list-data
        - --exchange 
        - {{ .Values.configcreds.exchange.name }}
        - --show-timerange 
        - --trading-mode 
        - {{ .Values.configcreds.trading_mode }} 
        - -p 
        - "XLM/USDT:USDT"
        - "XRP/USDT:USDT"
        - "IOTA/USDT:USDT"
        - "ALGO/USDT:USDT"
        - "BTC/USDT:USDT"
        - "ETH/USDT:USDT"
        - "SOL/USDT:USDT"
        - "FDUSD/USDT:USDT"
        - "ENA/USDT:USDT"
        - "WIF/USDT:USDT"
        - "PEPE/USDT:USDT"
        - "BCH/USD:USDT"
        - "LTC/USDT:USDT"
        - -d 
        - "/extra_strategies/data/"
        - --logfile
        - /extra_strategies/logs/listdata_{{ now | date "20060102" }}.log
        # - "/extra_strategies/data/{{ .Values.configcreds.exchange.name }}/{{ .Values.configcreds.trading_mode }}"
        volumeMounts:
        - name: extra-strategies
          mountPath: /extra_strategies
          readOnly: false          
        - name: configcreds
          mountPath: /freqtrade/configcreds
        - name: config
          mountPath: /freqtrade/config
{{- end }}

      # 
      # backtesting
      # freqtrade hyperopt --strategy DWT_LongShort -c config/config-bot-larissa-do-nothing.json -c configcreds/configcreds-bot-larissa-do-nothing.json --hyperopt-loss ShortTradeDurHyperOptLoss
      # 
{{- if .Values.dersalvador.ds_backtesting.enable  | default false}}
      - name: backtesting
        image: {{ .Values.image.base }}:{{ .Values.image.tag }}
        command:
        - freqtrade
        args:
        - backtesting
        - --export-filename
        - "/extra_strategies/data/{{ .Values.configcreds.exchange.name }}/{{ .Values.configcreds.trading_mode }}/backtest_result_{{ now | date "20060102" }}.json"
        - --breakdown 
        - day 
        - week
        - --export 
        - {{ .Values.configcreds.backtesting.exportType }}
        - --strategy-list 
        - DWT_LongShort 
        - TaSearchLevelG15m 
        - --timerange 
        - {{ now | dateModify .Values.configcreds.backtesting.hoursInThePast | date "20060102"  }}-{{ now | date "20060102" }} 
        - --config
        - /freqtrade/config/config-{{ .Release.Namespace }}.json
        - --config
        - /freqtrade/configcreds/configcreds-{{ .Release.Namespace }}.json
        - -d 
        - "/extra_strategies/data"
        - --logfile
        - /extra_strategies/logs/backtesting_{{ now | date "20060102" }}.log
        # - "/extra_strategies/data/{{ .Values.configcreds.exchange.name }}/{{ .Values.configcreds.trading_mode }}"
        volumeMounts:
        - name: extra-strategies
          mountPath: /extra_strategies
          readOnly: false          
        - name: configcreds
          mountPath: /freqtrade/configcreds
        - name: config
          mountPath: /freqtrade/config
{{- end }}

      # 
      # Hyperopting
      # freqtrade hyperopt --strategy DWT_LongShort -c config/config-bot-larissa-do-nothing.json -c configcreds/configcreds-bot-larissa-do-nothing.json --hyperopt-loss ShortTradeDurHyperOptLoss
      # 
      # - --timeframe-detail {{ .Values.configcreds.timeframe }} 
{{- if .Values.dersalvador.ds_hyperopt.enable | default false}}
      - name: hyperopt
        image: {{ .Values.image.base }}:{{ .Values.image.tag }}
        command:
        - freqtrade
        args:
        - hyperopt
        - --timeframe
        - {{ .Values.configcreds.timeframe }}
        - --ignore-missing-spaces
        - --analyze-per-epoch
        - --timerange 
        - {{ now | dateModify .Values.configcreds.backtesting.hoursInThePast | date "20060102"  }}-{{ now | date "20060102" }} 
        - --print-json
        - --print-all
        - --epochs 
        - "150"
        - --random-state 
        - "111"
        - --fee 
        - "0.01"
{{- if .Values.dersalvador.ds_hyperopt.enableprotections }}
        - --enable-protections
{{- end }}
        - --min-trades 
        - "{{ .Values.configcreds.max_open_trades }}"
        - --spaces 
        - roi
        - stoploss
        - trailing
        - trades
        - --config
        - /freqtrade/config/config-{{ .Release.Namespace }}.json
        - --config
        - /freqtrade/configcreds/configcreds-{{ .Release.Namespace }}.json
        - --strategy-path
        - /extra_strategies
        - --strategy
        - {{ .Values.bot.strategy_name }}
        - --hyperopt-loss 
        - {{ .Values.configcreds.ds_hyperopt.hyperlossfunction }}
        - -d 
        - "/extra_strategies/data"
        - --logfile
        - /extra_strategies/logs/hyperopt_{{ now | date "20060102" }}.log
        volumeMounts:
        - name: extra-strategies
          mountPath: /extra_strategies
          readOnly: false          
        - name: configcreds
          mountPath: /freqtrade/configcreds
        - name: config
          mountPath: /freqtrade/config
{{- end }}

# STRATGEY UPDATER START             
#       - name: freqtrade-strategy-updater-{{ .Release.Namespace }}
#         image: {{ .Values.image.base }}:{{ .Values.image.tag }}
#         command:
