          while true; do sleep 10; done;
        workingDir: /extra_strategies
        # Set the working directory if needed
        volumeMounts:
        - name: extra-strategies
          mountPath: /extra_strategies
          readOnly: false          
        - name: configcreds
          mountPath: /freqtrade/configcreds
        - name: config
          mountPath: /freqtrade/config
        - name: sqlite
          mountPath: /sqlite
      - name: freqtrade
        image: {{ .Values.image.base }}:{{ .Values.image.tag }}
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh","-c","sleep 60"]
        # command:
        # - freqtrade
        # args:
        # - trade
        # {{- if .Values.bot.debug }}
