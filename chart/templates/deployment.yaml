---
{{- if .Values.bot.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: freqtrade-{{ .Release.Namespace }}
  labels:
    app: freqtrade
    env: production   # Adding a label named env with value production
spec:
  selector:
    matchLabels:
      app: freqtrade-{{ .Release.Namespace }}
  template:
    metadata:
      labels:
        app: freqtrade-{{ .Release.Namespace }}
    spec:
      # nodeName: {{ .Values.kubernetes.nodeNameBackTestingResultsReader }} # pool-dersalvador-y5w2t # pool-dersalvador-ylyw0
      initContainers:
      - name: take-sqlite-dir-ownership
        image: {{ .Values.image.base }}:{{ .Values.image.tag }}
        securityContext:
          allowPrivilegeEscalation: false
          runAsUser: 0
        command:
        - bash
        - -c
        - |
          rm -rf /extra_strategies/lost+found
          echo chown -R ftuser:ftuser /sqlite 
          echo chown -R ftuser:ftuser /freqtrade
          echo chown -R ftuser:ftuser /extra_strategies
          # echo chown -R ftuser:ftuser /extra_strategies
          # echo chmod -R 777 /extra_strategies
          chown -R ftuser:ftuser /sqlite 
          chown -R ftuser:ftuser /freqtrade
          chown -R ftuser:ftuser /extra_strategies
          chmod -R 777 /extra_strategies
          find /sqlite       
        volumeMounts:
        - name: extra-strategies
          mountPath: /extra_strategies
          readOnly: false          
        - mountPath: /sqlite
          name: sqlite
{{- if .Values.kubernetes.copyContainer }}          
      - name: copy-strategy-to-default
        image: {{ .Values.image.base }}:{{ .Values.image.tag }}
        securityContext:
          allowPrivilegeEscalation: false
          runAsUser: 0
        command: 
        - sh
        - -c
        - |
          set -x
          echo cp -r /extra_strategies/* /freqtrade/user_data/strategies/
          cp -r /extra_strategies/* /freqtrade/user_data/strategies/
          # echo Copying strategy {{ .Values.bot.strategy_name }}* to default path
          # cp -r /extra_strategies/{{ .Values.bot.strategy_name }}* /freqtrade/user_data/strategies/
          # cp -r /freqtrade/user_data/strategies/. /freqtrade/user_data/extra_strategies/ 
          echo find /extra_strategies
          find /extra_strategies
          echo Strategy {{ .Values.bot.strategy_name }} in /extra_strategies
          cat /extra_strategies/{{ .Values.bot.strategy_name }}* 
          echo Strategy {{ .Values.bot.strategy_name }} in /freqtrade/user_data/strategies
          cat /freqtrade/user_data/strategies/{{ .Values.bot.strategy_name }}* 
        volumeMounts:
        - name: extra-strategies
          mountPath: /extra_strategies
          readOnly: false          
{{- end }}
      - name: freqtrade-list-strategies-{{ .Release.Namespace }}
        image: {{ .Values.image.base }}:{{ .Values.image.tag }}
        command:
        - freqtrade
        args:
        - list-strategies
{{- if .Values.bot.debug }}
        - {{ .Values.bot.debuglevel }}
{{- end }}
        - --recursive-strategy-search
        - --strategy-path
        - /extra_strategies
        - --config
        - /freqtrade/config/config-{{ .Release.Namespace }}.json
        - --config
        - /freqtrade/configcreds/configcreds-{{ .Release.Namespace }}.json
        - --datadir
        - /freqtrade/user_data/data
        - --userdir
        - /freqtrade/user_data      
        volumeMounts:
        - name: configcreds
          mountPath: /freqtrade/configcreds
        - name: config
          mountPath: /freqtrade/config
        - name: sqlite
          mountPath: /sqlite
        - name: extra-strategies
          mountPath: /extra_strategies
          readOnly: false
# STRATGEY UPDATER START             
#       - name: freqtrade-strategy-updater-{{ .Release.Namespace }}
#         image: {{ .Values.image.base }}:{{ .Values.image.tag }}
#         command:
#         - freqtrade
#         args:
#         - strategy-updater
# {{- if .Values.bot.debug }}
#         - {{ .Values.bot.debuglevel }}
# {{- end }}
#         - --strategy-list
#         - {{ .Values.bot.strategy_name }}
#         # - --recursive-strategy-search
#         - --strategy-path
#         - /extra_strategies
#         - --log-file 
#         - /tmp/freqtrade.log
#         - --datadir
#         - /freqtrade/user_data/data
#         - --userdir
#         - /freqtrade/user_data 
#         volumeMounts:         
#         - name: extra-strategies
#           mountPath: /extra_strategies
#           readOnly: false          
# STRATGEY UPDATER END             
#       - name: freqtrade-test-pairs-{{ .Release.Namespace }}
#         image: {{ .Values.image.base }}:{{ .Values.image.tag }}
#         command:
#         - freqtrade
#         args:
#         - test-pairlist
# {{- if .Values.bot.debug }}
#         - {{ .Values.bot.debuglevel }}
# {{- end }}
#         - --config
#         - /freqtrade/config/config-{{ .Release.Namespace }}.json
#         - --config
#         - /freqtrade/configcreds/configcreds-{{ .Release.Namespace }}.json
#         volumeMounts:
#         # - name: extra-strategies
#         #   mountPath: /extra_strategies
#         #   readOnly: false             
#         - name: strategies-default
#           mountPath: /freqtrade/user_data/strategies
#           readOnly: false
#         - name: configcreds
#           mountPath: /freqtrade/configcreds
#         - name: config
#           mountPath: /freqtrade/config
      containers:
      - name: freqtrade-{{ .Release.Namespace }}
        image: {{ .Values.image.base }}:{{ .Values.image.tag }}
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh","-c","sleep 60"]
        command:
        - freqtrade
        args:
        - trade
{{- if .Values.bot.debug }}
        - {{ .Values.bot.debuglevel }}
{{- end }}
        - --config
        - /freqtrade/config/config-{{ .Release.Namespace }}.json
        - --config
        - /freqtrade/configcreds/configcreds-{{ .Release.Namespace }}.json
        - --strategy-path
        - /extra_strategies
        - --strategy
        - {{ .Values.bot.strategy_name }}
        - --db-url
        - sqlite:////sqlite/tradesv3.sqlite
        - --recursive-strategy-search
        - --freqaimodel 
        - {{ .Values.bot.freqaimodel }}
        - --freqaimodel-path 
        - /freqtrade/freqtrade/freqai/prediction_models
        - --log-file 
        - /tmp/freqtrade.log
        - --datadir
        - /freqtrade/user_data/data
        - --userdir
        - /freqtrade/user_data 
        volumeMounts:
        - name: extra-strategies
          mountPath: /extra_strategies
          readOnly: false          
        - name: configcreds
          mountPath: /freqtrade/configcreds
        - name: config
          mountPath: /freqtrade/config
        - name: sqlite
          mountPath: /sqlite
        ports:
        - name: api
          containerPort: {{ .Values.config.api_server.listen_port }}
      imagePullSecrets:
      - name: deploy-key-gcr
      volumes:
      - name: extra-strategies
        persistentVolumeClaim:
          claimName: freqtrade-extra-strategies   
      - name: configcreds
        configMap:
          name: freqtrade-config-creds-{{ .Release.Namespace }}
      - name: nfi-hold-trades
        configMap:
          name: freqtrade-nfi-hold-trades-{{ .Release.Namespace }}
      - name: config
        configMap:
          name: freqtrade-config-{{ .Release.Namespace }}
      - name: sqlite
        persistentVolumeClaim:
          claimName: freqtrade-sqlite      
---
{{- end }}
