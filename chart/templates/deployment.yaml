        command:
        - bash
        - -c
        - |
           pip install multiprocess mailtrap
           echo freqtrade trade \
           {{- if .Values.bot.debug }} {{ .Values.bot.debuglevel }} {{- end }}  \
           --config  \
           /freqtrade/config/config-{{ .Release.Namespace }}.json \
           --config \
           /freqtrade/configcreds/configcreds-{{ .Release.Namespace }}.json \
           --strategy-path \
           /extra_strategies \
           --strategy \
           {{ .Values.bot.strategy_name }} \
           --db-url \
           sqlite:////sqlite/tradesv3.sqlite \
           --recursive-strategy-search \
           --freqaimodel  \
           {{ .Values.bot.freqaimodel }} \
           --freqaimodel-path  \
           /freqtrade/freqtrade/freqai/prediction_models \
           --logfile \
           /extra_strategies/logs/freqtrade_{{ now | date "20060102" }}.log \
           --datadir \
           "/extra_strategies/data" \
           --userdir \
           /freqtrade/user_data 
           echo ""
           echo "Starting Freqtrade"
           echo ""
           freqtrade trade {{- if .Values.bot.debug }} {{ .Values.bot.debuglevel }} {{- end }} \
           --config  /freqtrade/config/config-{{ .Release.Namespace }}.json  \
           --config /freqtrade/configcreds/configcreds-{{ .Release.Namespace }}.json \
           --strategy-path /extra_strategies \
           --strategy {{ .Values.bot.strategy_name }} \
           --db-url sqlite:////sqlite/tradesv3.sqlite \
           --recursive-strategy-search \
           --freqaimodel  {{ .Values.bot.freqaimodel }} \
           --freqaimodel-path  /freqtrade/freqtrade/freqai/prediction_models \
           --logfile /extra_strategies/logs/freqtrade_{{ now | date "20060102" }}.log \
           --datadir "/extra_strategies/data" \
           --userdir /freqtrade/user_data
        volumeMounts:
        - name: tmp
          mountPath: /tmp
          readOnly: false          
        - name: extra-strategies
          mountPath: /extra_strategies
          readOnly: false          
        - name: configcreds
          mountPath: /freqtrade/configcreds
        - name: config
          mountPath: /freqtrade/config
        - name: sqlite
          mountPath: /sqlite
        ports:
        - name: api
          containerPort: {{ .Values.config.api_server.listen_port }}
      imagePullSecrets:
      - name: deploy-key-gcr
      volumes:
      - name: extra-strategies
        persistentVolumeClaim:
          claimName: freqtrade-extra-strategies   
      - name: tmp
        persistentVolumeClaim:
          claimName: freqtrade-tmp
      - name: configcreds
