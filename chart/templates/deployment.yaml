{{- if .Values.bot.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: freqtrade-{{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: freqtrade-{{ .Release.Namespace }}
  template:
    metadata:
      labels:
        app: freqtrade-{{ .Release.Namespace }}
    spec:
      nodeName: pool-dersalvador-ylyw0
      initContainers:
      - name: take-sqlite-dir-ownership
        image: {{ .Values.image.base }}:{{ .Values.image.tag }}
        securityContext:
          allowPrivilegeEscalation: false
          runAsUser: 0
        # securityContext:
        #   allowPrivilegeEscalation: false
        #   runAsUser: 0
        command:
        - bash
        args: ["-c","chown -R ftuser:ftuser /sqlite; ls -ltra /sqlite" ] 
        volumeMounts:
        - mountPath: /sqlite
          name: sqlite
      imagePullSecrets:
      - name: do-dersalvador-registry
      containers:
      - name: freqtrade-{{ .Release.Namespace }}
        image: {{ .Values.image.base }}:{{ .Values.image.tag }}
        # securityContext:
        #  runAsUser: 1000
        #  runAsGroup: 1000
        command:
        - freqtrade
        args:
        - trade
        - --config
        - /freqtrade/config/config.json
        - --strategy-path 
        - /freqtrade/user_data/strategies
        - --strategy
        - {{ .Values.bot.strategy_name }}
        - --db-url
        - sqlite:////sqlite/tradesv3.sqlite
        - --recursive-strategy-search
        - --freqaimodel 
        - {{ .Values.bot.freqaimodel }}
        - --freqaimodel-path 
        - /freqtrade/freqtrade/freqai/prediction_models
        volumeMounts:
        - mountPath: /freqtrade/config
          name: config
        - mountPath: /freqtrade/user_data/strategies
          name: strategies
        - mountPath: /sqlite
          name: sqlite
        ports:
        - name: api
          containerPort: {{ .Values.config.api_server.listen_port }}
          # hostIP: 138.68.122.196
          # hostPort: 8084  
        # - name: frequi
        #  containerPort: 8080
      imagePullSecrets:
      - name: do-dersalvador-registry
      volumes:
      - name: config
        configMap:
          name: freqtrade-config-{{ .Release.Namespace }}
      - name: strategies
        configMap:
          name: freqtrade-strategies-{{ .Release.Namespace }}
      - name: sqlite
        persistentVolumeClaim:
          claimName: freqtrade-sqlite-{{ .Release.Namespace }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: freqtrade-sqlite-{{ .Release.Namespace }}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.bot.pvc_size }}
{{- end }}
