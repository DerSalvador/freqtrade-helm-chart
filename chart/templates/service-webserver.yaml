{{- if (and .Values.bot.enabled .Values.config.api_server.enabled) }}
apiVersion: v1
kind: Service
metadata:
  name: freqtrade-webserver-clusterip-{{ .Release.Namespace }}
  labels:
    app: freqtrade-webserver-clusterip-{{ .Release.Namespace }}
spec:
  type: ClusterIP
  ports:
  - protocol: TCP
    port: {{ .Values.config.api_server.listen_port_webserver }}
    targetPort: api-webserver
  selector:
    app: freqtrade-webserver-{{ .Release.Namespace }}
{{- end }}
