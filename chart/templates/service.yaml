# {{- if (and .Values.bot.enabled .Values.config.api_server.enabled) }}
apiVersion: v1
kind: Service
metadata:
  name: freqtrade-clusterip-{{ .Release.Namespace }}
  labels:
    app: freqtrade-clusterip-{{ .Release.Namespace }}
spec:
  type: ClusterIP
  ports:
  - protocol: TCP
    port: {{ .Values.config.api_server.listen_port }}
    targetPort: api
  selector:
    app: freqtrade-{{ .Release.Namespace }}
# {{- end }}
