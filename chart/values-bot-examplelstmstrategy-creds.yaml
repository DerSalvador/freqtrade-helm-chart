---
kubernetes:
  nodePort: 32364 # generated by template dsTradingDeployNewStrategyFromTemplate.sh
configcreds:
  available_capital: 2000
  max_open_trades: 6
  trading_mode: futures
  margin_mode: isolated
  timeframe: 5m
  bot_name: bot-ExampleLSTMStrategy # generated by template dsTradingDeployNewStrategyFromTemplate.sh
  dry_run: true
  dry_run_wallet: 2000
  initial_state: running
  stoploss: -0.99
  trailing_stop: False
  trailing_only_offset_is_reached: False                                                               
  trailing_stop_positive: 0.01
  trailing_stop_positive_offset: 0.04    
  order_types:
    entry: "limit"
    exit": "market"
    emergency_exit: "market"
    stoploss: "market"
    stoploss_on_exchange: False
    stoploss_on_exchange_interval: 60
    stoploss_on_exchange_limit_ratio: 0.99
  use_custom_stoploss: false
  has_downtime_protection: false
  position_adjustment_enable: false
  exchange:
    ccxt_config:
      enableRateLimit: true
      rateLimit: 800
      options:
        defaultType: future
        leverage: 100
    ccxt_async_config:
      enableRateLimit: true
      rateLimit: 800
      options:
        defaultType: future
        leverage: 100
    name: binance
    key: b3r35QxZ6z8PKS7vFSoJztdTwI4mQJ1owCBmp08pjKj1FQWhFFxvFZ9yqStfpGwm
    secret: tHwYon2naTO6111rCo3c6yv84szDFFsaovNnf9eUY9FYl5Ub07c9IuZ8WTZx4uov
  freqai:
    rl_config:
      train_cycles: 25
      add_state_info: true
      max_trade_duration_candles: 300
      max_training_drawdown_pct: 0.02
      cpu_count: 8
      model_type: PPO
      policy_type: MlpPolicy
      model_reward_parameters:
        rr: 1
        profit_aim: 0.5
    enabled: true
    fit_live_predictions_candles: 300
    purge_old_models: true # 2
    train_period_days: 30
    identifier: unique-id
    backtest_period_days: 7
    live_retrain_hours: 0
    feature_parameters:
      include_timeframes:
        - 15m
        - 1h
      include_corr_pairlist:
        - ATOM/USDT
        - MATIC/USDT
        - ADA/USDT
        - ALGO/USDT
        - APE/USDT
        - ATOM/USDT
        - AVAX/USDT
        - BCH/USDT
        - BTC/USDT
        - DAI/USDT
        - DOGE/USDT
        - DOT/USDT
        - EOS/USDT
        - ETH/USDT
        - LINK/USDT
        - LTC/USDT
        - MANA/USDT
        - MATIC/USDT
        - SHIB/USDT
        - SOL/USDT
        - XMR/USDT
        - XRP/USDT
        - XTZ/USDT
        - BTC/USDT:USDT
        - ETH/USDT:USDT
      label_period_candles: 20
      include_shifted_candles: 2
      DI_threshold: 0.9
      weight_factor: 0.9
      principal_component_analysis: false
      use_SVM_to_remove_outliers: true
      indicator_periods_candles:
        - 3
        - 10
        - 20
      plot_feature_importances: 0
    data_split_parameters:
      test_size: 0
      random_state: 1
    model_training_parameters:
      n_estimators: 800
