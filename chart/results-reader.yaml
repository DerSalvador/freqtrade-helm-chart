{{- if (and .Values.backtesting.enabled .Values.backtesting.results.reader_enabled) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: results-reader-config-{{ .Release.Namespace }}
data:
  default.conf: |
    server {
        listen       80;
        server_name  localhost;

        location /results {
            root /usr/share/nginx;
            autoindex on;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: results-reader-{{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: results-reader-{{ .Release.Namespace }}
  template:
    metadata:
      labels:
        app: results-reader-{{ .Release.Namespace }}
    spec:
{{- if (.Values.kubernetes.nodeNameBackTestingResultsReeader) }}
      nodeName: {{ .Values.kubernetes.nodeNameBackTestingResultsReeader }} #  pool-dersalvador-y5wl4 # pool-dersalvador-y6z2l
{{- end }}
      containers:
      - name: nginx
        image: nginx:1.19.6
        volumeMounts:
        - mountPath: /usr/share/nginx/results
          name: results
        - mountPath: /etc/nginx/conf.d
          name: config
        ports:
        - name: http
          containerPort: 80
      volumes:
      - name: results
        persistentVolumeClaim:
          claimName: backtesting-results-{{ .Release.Namespace }}
      - name: config
        configMap:
          name: results-reader-config-{{ .Release.Namespace }}
      imagePullSecrets:
      - name: do-dersalvador-registry
---
apiVersion: v1
kind: Service
metadata:
  name: results-reader-{{ .Release.Namespace }}
  labels:
    app: results-reader-{{ .Release.Namespace }}
spec:
  type: ClusterIP
  ports:
  - protocol: TCP
    port: 80
    targetPort: http
  selector:
    app: results-reader-{{ .Release.Namespace }}
---
{{- end }}
